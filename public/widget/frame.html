<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <title>Suporte Unicopag</title>
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="w">
    <header class="w-head">
      <div class="w-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
      </div>
      <div class="w-head-text">
        <h1 id="title">Suporte Unicopag</h1>
        <p id="status" class="w-status"><span class="w-dot"></span><span id="status-text">Conectando…</span></p>
      </div>
      <button id="help" type="button" class="w-icon-btn" aria-label="Tutoriais" title="Tutoriais" aria-expanded="false" aria-controls="help-panel">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20"/></svg>
      </button>
      <button id="close" type="button" class="w-icon-btn" aria-label="Fechar o chat" title="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </header>

    <div id="banner" class="w-banner" role="status" hidden></div>

    <main id="scroll" class="w-scroll">
      <button id="older" type="button" class="w-older" hidden>Ver mensagens anteriores</button>

      <section id="welcome" class="w-welcome" hidden>
        <h2 id="welcome-title">Olá. Como podemos ajudar?</h2>
        <p id="welcome-text">Escreva sua dúvida e nossa equipe responde por aqui.</p>
        <div id="topics" class="w-topics" hidden></div>
        <button id="help-card" type="button" class="w-help">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20"/></svg>
          <span>Tutoriais de integração<small>Passo a passo das plataformas parceiras</small></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </section>

      <!-- Visitante do site: identifica-se e envia a primeira mensagem antes de a conversa começar -->
      <form id="lead" class="w-lead" novalidate hidden>
        <h2>Como podemos ajudar?</h2>
        <p id="lead-text">Deixe seu contato e sua mensagem. Nossa equipe responde por aqui.</p>
        <label>Nome
          <input id="lead-name" type="text" autocomplete="name" maxlength="80" required />
        </label>
        <label>WhatsApp
          <input id="lead-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(11) 91234-5678" required />
        </label>
        <label>E-mail <span>(opcional)</span>
          <input id="lead-email" type="email" autocomplete="email" maxlength="255" />
        </label>
        <label>Mensagem
          <textarea id="lead-message" rows="3" maxlength="2000" required></textarea>
        </label>
        <p id="lead-error" class="w-lead-error" role="alert" hidden></p>
        <button id="lead-submit" type="submit" class="w-lead-submit">Iniciar conversa</button>
        <p class="w-lead-note">Usamos seus dados só para responder ao seu contato.</p>
      </form>

      <ol id="messages" class="w-list" aria-live="polite" aria-label="Conversa"></ol>

      <div id="typing" class="w-typing" hidden>
        <span class="w-typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="typing-text"></span>
      </div>
    </main>

    <button id="jump" type="button" class="w-jump" hidden>
      Novas mensagens
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>

    <section id="help-panel" class="w-panel" aria-label="Tutoriais" hidden>
      <div class="w-panel-bar">
        <button id="help-back" type="button" class="w-panel-back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          Voltar ao chat
        </button>
        <a id="help-open" class="w-panel-link" href="/ajuda" target="_blank" rel="noopener">
          Abrir em nova aba
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M11 7H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"/></svg>
        </a>
      </div>
      <iframe id="help-frame" title="Tutoriais da Unicopag"></iframe>
    </section>

    <form id="composer" class="w-composer" autocomplete="off">
      <ul id="staged" class="w-staged" hidden></ul>
      <div class="w-field">
        <button id="attach" type="button" class="w-icon-btn" aria-label="Anexar arquivo" title="Anexar arquivo" hidden>
          <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>
        </button>
        <textarea id="input" rows="1" maxlength="4000" placeholder="Escreva sua mensagem" aria-label="Mensagem" disabled></textarea>
        <button id="send" type="submit" class="w-send" aria-label="Enviar mensagem" title="Enviar" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
        </button>
      </div>
      <input id="file" type="file" multiple hidden
        accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.csv,.xls,.xlsx,.doc,.docx" />
    </form>
  </div>

  <script src="widget.js" defer></script>
</body>
</html>
